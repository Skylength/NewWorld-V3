<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#20272b" />
  <title>新世界 · 调试工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%2320272b%22/%3E%3Cpath d=%22M8 9v14h16M13 7v11h7V7M6 13h20%22 fill=%22none%22 stroke=%22%23f5f5f0%22 stroke-width=%222%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#play" aria-label="新世界首页"><span class="brand-symbol" aria-hidden="true">世</span><span>新世界</span></a>
    <nav class="mode-nav" aria-label="工作模式"><a id="mode-play" href="#play">游玩</a><a id="mode-debug" href="#debug" aria-current="page">调试</a></nav>
    <div class="header-context"><span id="play-save-state" hidden>正在读取</span><span id="mode-badge" class="environment-badge">连接中</span><span id="connection-status" class="connection-status">本地服务</span></div>
    <button id="toggle-saves" class="header-button" type="button" aria-expanded="false" aria-controls="save-drawer">存档 <span aria-hidden="true">⌄</span></button>
  </header>
  <div id="connection-alert" class="connection-alert" role="alert" hidden></div>
  <div id="mode-notice" class="mode-notice" hidden></div>
  <section id="save-drawer" class="save-drawer" aria-label="存档管理" hidden>
    <div><strong id="save-world-title">正在读取世界</strong><p id="save-status" class="hint">读取存档…</p></div>
    <label class="save-picker">选择旅程<select id="save-select" disabled><option>正在读取…</option></select></label>
    <div class="save-actions"><button id="load-save" class="button secondary" type="button" disabled>继续存档</button><button id="new-world" class="button secondary" type="button" disabled>＋ 新世界</button><button id="refresh-saves" class="button quiet" type="button">刷新</button><a class="button quiet" href="/api/export" download>导出存档 ↗</a></div>
    <p class="hint save-explanation">每轮自动保存。新建世界会保留已有存档。</p>
  </section>

  <main id="play-page" class="play-page" aria-label="游玩" hidden>
    <nav class="game-rail" aria-label="游玩功能">
      <button type="button" data-panel="map" aria-controls="game-panel" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Z M9 3v16 M15 5v16"/></svg>地图</button>
      <button type="button" data-panel="npcs" aria-controls="game-panel" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><path d="M3 21v-4a6 6 0 0 1 12 0v4 M17 4a3 3 0 0 1 0 6 M18 14a5 5 0 0 1 3 4v3"/></svg>人物</button>
      <button type="button" disabled title="背包功能尚未接入"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="6" width="14" height="16" rx="3"/><path d="M9 6V4a3 3 0 0 1 6 0v2 M5 12h14 M9 16h6"/></svg>背包<small>待开放</small></button>
      <button type="button" disabled title="技能功能尚未接入"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></svg>技能<small>待开放</small></button>
      <button type="button" data-panel="journal" aria-controls="game-panel" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5C9 3 5 3 2 4v16c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-7-1-10 1v16"/></svg>日志</button>
    </nav>
    <section class="game-main" aria-label="故事与行动">
      <div class="game-scene"><div><span id="world-title" class="hint">正在打开世界</span><strong id="current-location">—</strong></div><span id="world-clock" class="hint">等待世界状态</span><button class="button quiet" type="button" data-panel="scene" aria-controls="game-panel" aria-expanded="false">场景详情 ›</button></div>
      <div id="story-scroll" class="story-scroll" tabindex="0" aria-label="故事记录"><div id="story" class="story"><div class="empty-state">正在读取这个世界…</div></div></div>
      <div class="game-compose-wrap">
        <button id="latest-story" class="button secondary" type="button" hidden>回到最新 ↓</button>
        <div class="composer-area">
          <div id="config-notice" class="callout warning" hidden>模型尚未配置，请配置本地服务后继续。</div>
          <div id="turn-status" class="turn-status" role="status" aria-live="polite" hidden></div>
          <div id="action-error" class="callout error" role="alert" hidden></div>
          <form id="action-form" class="composer">
            <select id="action-mode" aria-label="当前操作类型" hidden><option value="interact">普通行动</option><option value="explore">探索新地点</option></select>
            <div id="exploration-intent" class="intent-chip" hidden><span>地图行动 · 探索新地点</span><button id="clear-intent" type="button" aria-label="取消探索模式，恢复普通行动">×</button></div>
            <label class="sr-only" for="action-input">说些什么，或描述你想做的事</label><textarea id="action-input" name="action" rows="2" maxlength="2000" placeholder="说些什么，或描述你想做的事…" disabled></textarea>
            <div class="composer-bottom"><span id="action-mode-help" class="hint">自由描述对白、行动或想去的地方</span><span id="character-count" class="hint">0 / 2000</span><button id="cancel-turn" class="button secondary" type="button" hidden>停止生成</button><button id="send-action" class="button primary" type="submit" disabled>发送 ↑</button></div>
          </form>
          <div class="composer-hint">Enter 发送 · Shift + Enter 换行</div>
        </div>
      </div>
    </section>
    <aside id="game-panel" class="game-panel" aria-labelledby="game-panel-title" hidden>
      <header class="game-panel-header"><h2 id="game-panel-title">地图</h2><button id="close-game-panel" type="button" class="button quiet" aria-label="关闭功能面板">关闭 ×</button></header>
      <div class="game-panel-scroll">
        <section id="panel-map" hidden><div class="map-panel-heading"><h3>已知地点</h3><span id="map-region-count" class="pill">0 个地点</span></div><p class="hint map-guidance">点击地点前往，详情仅查看。连线表示区域包含关系。</p><div id="play-map" class="play-map" aria-label="已知地点"></div><button id="explore-region" type="button" class="map-explore-button">＋ 探索新地点<span>描述目的地，让世界继续展开</span></button><div id="play-region-detail" class="play-region-detail"></div></section>
        <section id="panel-scene" hidden></section>
        <section id="panel-journal" hidden></section><section id="panel-npcs" hidden></section>
      </div>
    </aside>
  </main>

  <main id="debug-page" class="debug-shell" aria-label="调试工作台">
    <aside id="runs-panel" class="runs-panel" aria-label="运行记录">
      <div class="runs-heading"><div><span class="eyebrow">RUNS</span><h1>运行记录 <span id="run-count" class="count">0</span></h1></div><button id="toggle-runs" class="button quiet" type="button" aria-expanded="true" aria-controls="runs-body">收起列表</button></div>
      <div id="runs-body" class="runs-body"><label class="search-box"><span aria-hidden="true">⌕</span><input id="run-search" type="search" placeholder="搜索行动或运行 ID" aria-label="搜索运行记录" /></label><div class="run-filters"><label class="sr-only" for="run-filter">运行状态筛选</label><select id="run-filter"><option value="all">全部状态</option><option value="failed">失败</option><option value="cancelled">已取消</option><option value="completed">已提交</option><option value="running">运行中</option></select><label class="follow-control"><input id="follow-latest" type="checkbox" checked /><span>跟随最新</span></label></div><div id="run-list" class="run-list"><div class="list-empty">读取运行记录…</div></div></div>
      <div class="runs-footer"><span id="debug-world-name">当前世界</span><span id="current-version" class="mono">—</span></div>
    </aside>
    <section class="debug-workspace" aria-label="所选运行">
      <header id="run-summary" class="run-summary"><div class="eyebrow">INSPECT RUN</div><h2>正在读取调试信息</h2></header>
      <div class="workspace-toolbar"><div id="debug-tabs" class="debug-tabs" role="tablist" aria-label="调试视图"><button id="tab-overview" type="button" role="tab" aria-selected="true" aria-controls="debug-content" data-tab="overview">运行链路</button><button id="tab-context" type="button" role="tab" aria-selected="false" aria-controls="debug-content" tabindex="-1" data-tab="context">上下文</button><button id="tab-diff" type="button" role="tab" aria-selected="false" aria-controls="debug-content" tabindex="-1" data-tab="diff">提示词差异</button><button id="tab-changes" type="button" role="tab" aria-selected="false" aria-controls="debug-content" tabindex="-1" data-tab="changes">世界变化</button><button id="tab-world" type="button" role="tab" aria-selected="false" aria-controls="debug-content" tabindex="-1" data-tab="world">当前世界</button></div></div>
      <div id="debug-content" class="debug-content" role="tabpanel" aria-labelledby="tab-overview" tabindex="0"></div>
    </section>
    <aside id="evidence-panel" class="evidence-panel" aria-label="证据详情"><div class="evidence-topline"><span class="eyebrow">INSPECTOR</span><button id="copy-evidence" class="button quiet" type="button" disabled>复制证据</button></div><div id="evidence-content" class="evidence-content"><div class="empty-state compact">点击链路中的节点，查看对应证据。</div></div></aside>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
