name: Functional acceptance

on:
  push:
    paths: ['src/**', 'examples/**', 'fixtures/**', 'acceptance/**', 'test/**', 'package*.json', 'tsconfig.json', '.github/workflows/acceptance.yml']
  pull_request:
    paths: ['src/**', 'examples/**', 'fixtures/**', 'acceptance/**', 'test/**', 'package*.json', 'tsconfig.json', '.github/workflows/acceptance.yml']
  workflow_dispatch:
    inputs:
      live:
        description: Run real actor and judge models
        type: boolean
        default: false
      trials:
        description: Trials per scenario (1-20)
        type: string
        default: '3'

permissions:
  contents: read

jobs:
  mechanism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run acceptance -- --mode scripted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripted-acceptance
          path: reports/acceptance/
          if-no-files-found: ignore

  live:
    needs: mechanism
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.live) ||
      (github.event_name != 'workflow_dispatch' && vars.LIVE_ACCEPTANCE_ENABLED == 'true' &&
       (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      ACCEPTANCE_JUDGE_MODEL: ${{ vars.ACCEPTANCE_JUDGE_MODEL }}
      ACCEPTANCE_JUDGE_API_KEY: ${{ secrets.ACCEPTANCE_JUDGE_API_KEY }}
      ACCEPTANCE_JUDGE_BASE_URL: ${{ vars.ACCEPTANCE_JUDGE_BASE_URL }}
      TRIALS: ${{ inputs.trials || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run acceptance -- --mode live --trials "$TRIALS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-acceptance
          path: reports/acceptance/
          if-no-files-found: ignore
